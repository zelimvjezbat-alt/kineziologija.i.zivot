<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  --background: hsl(210, 40%, 98%);
  --foreground: hsl(222, 47%, 11%);
  --card: hsl(0, 0%, 100%);
  --border: hsl(214, 31%, 91%);
  --primary: hsl(189, 94%, 43%);
  --input: hsl(214, 31%, 91%);
  --ball: hsl(210, 40%, 94%);
}
.dark {
  --background: hsl(222, 84%, 4.9%);
  --foreground: hsl(210, 40%, 98%);
  --card: hsl(222, 84%, 6%);
  --border: hsl(217, 33%, 18%);
  --primary: hsl(186, 78%, 57%);
  --input: hsl(217, 33%, 18%);
  --ball: hsl(218, 33%, 14%);
}

body {
  background: var(--background);
  color: var(--foreground);
  font-family: sans-serif;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: 1rem;
}

.ball {
  width: 14rem;
  height: 14rem;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ball);
  border: 2px solid var(--primary);
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}

input {
  background: var(--input);
  color: var(--foreground);
  border: 1px solid var(--border);
  padding: .4rem;
  border-radius: .4rem;
}
</style>
</head>

<body class="p-6 min-h-screen">

<header class="flex justify-between items-center mb-12">
<h1 class="text-2xl font-bold"><span class="text-cyan-500">Gym</span> Tracker</h1>
<button id="themeToggle">🌙</button>
</header>

<main class="flex flex-wrap justify-center gap-12">

<div class="flex flex-col items-center gap-4">
  <div class="ball" id="recordsBall">🏆 Records</div>
  <div id="recordBalls" class="flex flex-wrap gap-3 justify-center"></div>
</div>

<div class="flex flex-col items-center gap-4">
  <div class="ball" id="creatorBall">➕ New Training</div>
  <div id="trainingBalls" class="flex flex-wrap gap-3 justify-center"></div>
</div>

</main>

<div id="contentContainer" class="max-w-xl mx-auto mt-10"></div>

<script>
const themeToggle = document.getElementById('themeToggle');
themeToggle.onclick = () => document.documentElement.classList.toggle('dark');

const contentContainer = document.getElementById('contentContainer');
const trainingBalls = document.getElementById('trainingBalls');
const recordBalls = document.getElementById('recordBalls');

let trainings = [];
let records = [];
let openTrainingIndex = null;
let recordsOpen = false;

/* STORAGE */
const saveData = () => {
  localStorage.setItem('gym_trainings', JSON.stringify(trainings));
  localStorage.setItem('gym_records', JSON.stringify(records));
};
const loadData = () => {
  trainings = JSON.parse(localStorage.getItem('gym_trainings') || '[]');
  records = JSON.parse(localStorage.getItem('gym_records') || '[]');
};

/* RECORDS */
function renderRecords() {
  recordsOpen = !recordsOpen;
  contentContainer.innerHTML = '';
  if (!recordsOpen) return;

  const card = document.createElement('div');
  card.className = 'card';

  const input = document.createElement('input');
  input.placeholder = 'Bench Press 100kg';

  const add = document.createElement('button');
  add.textContent = 'Add';
  add.className = 'bg-cyan-500 text-white px-3 py-1 rounded mt-2';

  add.onclick = () => {
    if (!input.value) return;
    records.push(input.value);
    input.value = '';
    saveData();
    renderRecordBalls();
  };

  card.append(input, add);
  contentContainer.appendChild(card);
}

function renderRecordBalls() {
  recordBalls.innerHTML = '';
  records.forEach((r, i) => {
    const b = document.createElement('div');
    b.className = 'ball w-32 h-32 text-xs p-2 flex-col';

    const text = document.createElement('div');
    text.textContent = r;

    const edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.className = 'text-yellow-400 text-xs';

    edit.onclick = () => {
      const val = prompt('Edit record:', r);
      if (val) {
        records[i] = val;
        saveData();
        renderRecordBalls();
      }
    };

    const del = document.createElement('button');
    del.textContent = '✕';
    del.className = 'text-red-400 text-xs';

    del.onclick = e => {
      e.stopPropagation();
      records.splice(i, 1);
      saveData();
      renderRecordBalls();
    };

    b.append(text, edit, del);
    recordBalls.appendChild(b);
  });
}

/* TRAININGS */
function renderTrainingBalls() {
  trainingBalls.innerHTML = '';
  trainings.forEach((t, i) => {
    const b = document.createElement('div');
    b.className = 'ball w-40 h-40 text-sm';
    b.textContent = t.name;
    b.onclick = () => toggleTraining(i);
    trainingBalls.appendChild(b);
  });
}

function toggleTraining(i) {
  openTrainingIndex = openTrainingIndex === i ? null : i;
  contentContainer.innerHTML = '';
  if (openTrainingIndex !== null) renderSingleTraining(i);
}

function renderSingleTraining(i) {
  const t = trainings[i];
  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `<h3 class="font-bold mb-2">${t.name}</h3>`;
  t.exercises.forEach(ex => {
    card.innerHTML += `<div>${ex.name} – ${ex.reps}×${ex.sets}</div>`;
  });

  const wrap = document.createElement('div');
  wrap.className = 'flex gap-2 mt-4';

  const edit = document.createElement('button');
  edit.textContent = 'Edit';
  edit.className = 'bg-yellow-500 text-white flex-1 rounded py-1';
  edit.onclick = () => renderEditTraining(i);

  const del = document.createElement('button');
  del.textContent = 'Delete';
  del.className = 'bg-red-500 text-white flex-1 rounded py-1';
  del.onclick = () => {
    trainings.splice(i, 1);
    saveData();
    renderTrainingBalls();
    contentContainer.innerHTML = '';
  };

  wrap.append(edit, del);
  card.appendChild(wrap);
  contentContainer.appendChild(card);
}

/* EDIT TRAINING – MOBILE FRIENDLY */
function renderEditTraining(i) {
  const t = trainings[i];
  contentContainer.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';

  const name = document.createElement('input');
  name.value = t.name;
  name.className = 'w-full mb-3';

  const exDiv = document.createElement('div');
  const inputs = [];

  t.exercises.forEach(ex => {
    const row = document.createElement('div');
    row.className = 'flex flex-col gap-2 mb-3';

    const n = document.createElement('input'); n.value = ex.name;
    const r = document.createElement('input'); r.value = ex.reps;
    const s = document.createElement('input'); s.value = ex.sets;

    row.append(n, r, s);
    exDiv.appendChild(row);
    inputs.push({ n, r, s });
  });

  const save = document.createElement('button');
  save.textContent = 'Save Changes';
  save.className = 'bg-cyan-500 text-white w-full py-2 rounded mt-2';

  save.onclick = () => {
    trainings[i] = {
      name: name.value,
      exercises: inputs.map(e => ({
        name: e.n.value,
        reps: e.r.value,
        sets: e.s.value
      }))
    };
    saveData();
    renderTrainingBalls();
    renderSingleTraining(i);
  };

  card.append(name, exDiv, save);
  contentContainer.appendChild(card);
}

/* CREATOR */
document.getElementById('creatorBall').onclick = () => location.reload();
document.getElementById('recordsBall').onclick = renderRecords;

loadData();
renderTrainingBalls();
renderRecordBalls();
</script>

</body>
</html>
